				<h1>VLSM Studio — Variable Length Subnet Mask Planner</h1>
				<p>
					VLSM Studio is a free online VLSM calculator (Variable Length Subnet
					Mask) for IPv4 networks. Enter a base CIDR block like 192.168.10.0/24
					and a list of host requirements — for example a staff LAN of 60 hosts,
					guest Wi-Fi of 25 hosts, and servers of 12 hosts — and the tool
					computes the optimal subnet plan.
				</p>
				<h2>How the VLSM allocation works</h2>
				<ol>
					<li>
						Each host request is rounded up to the smallest power-of-two block
						that fits it, reserving the network and broadcast addresses.
					</li>
					<li>
						Requests are sorted largest-first so big subnets claim the aligned
						low addresses.
					</li>
					<li>
						Every subnet lands on its own boundary: a /26 always starts on a
						multiple of 64 addresses.
					</li>
					<li>
						Leftover address ranges are reported as free space for future
						growth.
					</li>
				</ol>
				<h2>Features</h2>
				<ul>
					<li>
						Live subnet allocation with address-space map and full allocation
						table
					</li>
					<li>
						CIDR, netmask, usable host range, suggested gateway, and broadcast
						per subnet
					</li>
					<li>
						Point-to-point mode: 2-host links sized as /31 and 1-host as /32
						(RFC 3021)
					</li>
					<li>CSV export of the complete plan</li>
					<li>English and French interface — calculateur VLSM en français</li>
				</ul>
				<p>
